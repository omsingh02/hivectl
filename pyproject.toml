[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "hivectl"
version = "1.0.1"
description = "Linux lighting control for the Kreo Hive 98: hardware modes, per-key RGB, animations, music visualizer, Hyprland HUD"
readme = "README.md"
authors = [{ name = "Om Singh" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mouse = ["dbus-python"]  # Pegasus mouse battery in `hivectl status`

[project.scripts]
hivectl = "hivectl.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["hivectl*"]
