[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "kreo"
version = "3.0.0"
description = "Linux lighting control, animations, music visualizer and Hyprland HUD for the Kreo Hive 98 keyboard"
readme = "README.md"
authors = [{ name = "faulter" }]
license = { text = "MIT" }
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
mouse = ["dbus-python"]  # Pegasus mouse battery in `kreo status`

[project.scripts]
kreo = "kreo.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["kreo*"]
