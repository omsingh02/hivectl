<!doctype html>
<!--
  Source of brand social images:
    docs/brand/social-preview.png (1280x640, GitHub Social Preview)
    site/og.png & site/og.jpg     (1200x630, Open Graph social card)
  Rendered by docs/brand/export.mjs. Open in browser; add ?og for 1200x630.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>hivectl social preview</title>
  <style>
    @font-face {
      font-family: "Cal Sans";
      src: url("../../../telepad/website/assets/fonts/cal-sans.woff2") format("woff2");
    }
    @font-face {
      font-family: "Inter";
      src: url("../../../telepad/website/assets/fonts/inter-var.woff2") format("woff2");
      font-weight: 400 700 800;
    }

    :root {
      --bg: #060a13;
      --cyan: #00f0ff;
      --violet: #7c4dff;
      --pink: #ff007f;
      --amber: #ffb700;
      --fg: #f1f5f9;
      --sub: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: var(--bg);
      overflow: hidden;
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    body { width: 1280px; height: 640px; }
    body.og { width: 1200px; height: 630px; }

    .card {
      position: relative;
      width: 1280px;
      height: 640px;
      overflow: hidden;
      transform-origin: 0 0;
      color: var(--fg);
      background:
        radial-gradient(55% 65% at 85% 20%, rgba(124, 77, 255, 0.28), transparent 70%),
        radial-gradient(48% 54% at 10% 0%, rgba(0, 240, 255, 0.18), transparent 70%),
        radial-gradient(40% 45% at 75% 85%, rgba(255, 0, 127, 0.15), transparent 70%),
        var(--bg);
    }
    body.og .card {
      height: 672px;
      transform: scale(0.9375);
    }

    /* Subtle cyber grid mask */
    .grid {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(148, 163, 184, 0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(148, 163, 184, 0.06) 1px, transparent 1px);
      background-size: 56px 56px;
      -webkit-mask-image: radial-gradient(ellipse 80% 80% at 55% 40%, #000 20%, transparent 80%);
      mask-image: radial-gradient(ellipse 80% 80% at 55% 40%, #000 20%, transparent 80%);
    }

    /* Left Copy Column */
    .copy {
      position: absolute;
      left: 72px;
      top: 0;
      bottom: 0;
      width: 540px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      z-index: 2;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 32px;
    }
    .brand svg {
      width: 48px;
      height: 48px;
      filter: drop-shadow(0 0 16px rgba(0, 240, 255, 0.5));
    }
    .brand-name {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: -0.03em;
      color: #ffffff;
    }

    h1 {
      font: 800 58px/1.08 "Cal Sans", "Inter", sans-serif;
      letter-spacing: -0.03em;
      color: #ffffff;
      margin-bottom: 24px;
    }
    h1 span {
      background: linear-gradient(135deg, var(--cyan) 0%, #38bdf8 35%, var(--violet) 70%, var(--pink) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }

    .sub {
      font-size: 21px;
      line-height: 1.55;
      color: var(--sub);
    }
    .sub b {
      color: #ffffff;
      font-weight: 600;
    }

    /* Right Showcase Column */
    .showcase {
      position: absolute;
      right: 44px;
      top: 0;
      bottom: 0;
      width: 630px;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    /* Hardware Keyboard Chassis */
    .board-frame {
      width: 100%;
      padding: 18px 18px 20px;
      border-radius: 22px;
      background: linear-gradient(180deg, #181826 0%, #0d0d16 100%);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow:
        0 40px 90px -20px rgba(0, 0, 0, 0.95),
        0 0 80px -10px rgba(0, 240, 255, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.18),
        inset 0 0 20px rgba(0, 0, 0, 0.6);
      transform: perspective(1000px) rotateX(12deg) rotateY(-10deg) rotateZ(3deg);
    }

    canvas#kb {
      width: 100%;
      display: block;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="grid"></div>

    <div class="copy">
      <div class="brand">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
          <defs>
            <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0" stop-color="#00F0FF"/>
              <stop offset=".38" stop-color="#7C4DFF"/>
              <stop offset=".7" stop-color="#FF007F"/>
              <stop offset="1" stop-color="#FFB700"/>
            </linearGradient>
            <filter id="glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="6"/></filter>
          </defs>
          <path d="M64 9 L111.6 36.5 V91.5 L64 119 L16.4 91.5 V36.5 Z" fill="#0B0B11" stroke="url(#g)" stroke-width="8" stroke-linejoin="round"/>
          <rect x="43" y="43" width="42" height="42" rx="10" fill="url(#g)" filter="url(#glow)" opacity=".8"/>
          <rect x="43" y="43" width="42" height="42" rx="10" fill="url(#g)"/>
          <rect x="49.5" y="48.5" width="29" height="24" rx="6" fill="#FFFFFF" opacity=".22"/>
        </svg>
        <span class="brand-name">hivectl</span>
      </div>

      <h1>Your Kreo Hive 98,<br><span>fully alive on Linux.</span></h1>

      <p class="sub">Open source lighting control and animations.</p>
    </div>

    <div class="showcase">
      <div class="board-frame">
        <canvas id="kb"></canvas>
      </div>
    </div>
  </div>

  <script>
    if (location.search.includes('og')) {
      document.body.classList.add('og');
    }

    // Kreo Hive 98 key matrix
    const KEYS = [
      ["ESC","esc","Escape",0.0,0.0,1.0,1.0],["F1","f1","F1",1.75,0.0,1.0,1.0],["F2","f2","F2",2.75,0.0,1.0,1.0],["F3","f3","F3",3.75,0.0,1.0,1.0],["F4","f4","F4",4.75,0.0,1.0,1.0],["F5","f5","F5",6.25,0.0,1.0,1.0],["F6","f6","F6",7.25,0.0,1.0,1.0],["F7","f7","F7",8.25,0.0,1.0,1.0],["F8","f8","F8",9.25,0.0,1.0,1.0],["F9","f9","F9",10.75,0.0,1.0,1.0],["F10","f10","F10",11.75,0.0,1.0,1.0],["F11","f11","F11",12.75,0.0,1.0,1.0],["F12","f12","F12",13.75,0.0,1.0,1.0],["PRINTSCREEN","prt","PrintScreen",15.25,0.0,1.0,1.0],["DELETE","del","Delete",16.25,0.0,1.0,1.0],["PAGEUP","pgup","PageUp",17.25,0.0,1.0,1.0],["PAGEDOWN","pgdn","PageDown",18.25,0.0,1.0,1.0],
      ["GRAVE","`","Backquote",0.0,1.0,1.0,1.0],["1","1","Digit1",1.0,1.0,1.0,1.0],["2","2","Digit2",2.0,1.0,1.0,1.0],["3","3","Digit3",3.0,1.0,1.0,1.0],["4","4","Digit4",4.0,1.0,1.0,1.0],["5","5","Digit5",5.0,1.0,1.0,1.0],["6","6","Digit6",6.0,1.0,1.0,1.0],["7","7","Digit7",7.0,1.0,1.0,1.0],["8","8","Digit8",8.0,1.0,1.0,1.0],["9","9","Digit9",9.0,1.0,1.0,1.0],["0","0","Digit0",10.0,1.0,1.0,1.0],["MINUS","-","Minus",11.0,1.0,1.0,1.0],["EQUAL","=","Equal",12.0,1.0,1.0,1.0],["BACKSPACE","bksp","Backspace",13.0,1.0,2.0,1.0],["NUMLOCK","num","NumLock",15.25,1.0,1.0,1.0],["KP_DIVIDE","/","NumpadDivide",16.25,1.0,1.0,1.0],["KP_MULTIPLY","*","NumpadMultiply",17.25,1.0,1.0,1.0],["KP_SUBTRACT","-","NumpadSubtract",18.25,1.0,1.0,1.0],
      ["TAB","tab","Tab",0.0,2.0,1.5,1.0],["Q","Q","KeyQ",1.5,2.0,1.0,1.0],["W","W","KeyW",2.5,2.0,1.0,1.0],["E","E","KeyE",3.5,2.0,1.0,1.0],["R","R","KeyR",4.5,2.0,1.0,1.0],["T","T","KeyT",5.5,2.0,1.0,1.0],["Y","Y","KeyY",6.5,2.0,1.0,1.0],["U","U","KeyU",7.5,2.0,1.0,1.0],["I","I","KeyI",8.5,2.0,1.0,1.0],["O","O","KeyO",9.5,2.0,1.0,1.0],["P","P","KeyP",10.5,2.0,1.0,1.0],["LBRACKET","[","BracketLeft",11.5,2.0,1.0,1.0],["RBRACKET","]","BracketRight",12.5,2.0,1.0,1.0],["BACKSLASH","\\","Backslash",13.5,2.0,1.5,1.0],["KP_7","7","Numpad7",15.25,2.0,1.0,1.0],["KP_8","8","Numpad8",16.25,2.0,1.0,1.0],["KP_9","9","Numpad9",17.25,2.0,1.0,1.0],["KP_ADD","+","NumpadAdd",18.25,2.0,1.0,2.0],
      ["CAPSLOCK","caps","CapsLock",0.0,3.0,1.75,1.0],["A","A","KeyA",1.75,3.0,1.0,1.0],["S","S","KeyS",2.75,3.0,1.0,1.0],["D","D","KeyD",3.75,3.0,1.0,1.0],["F","F","KeyF",4.75,3.0,1.0,1.0],["G","G","KeyG",5.75,3.0,1.0,1.0],["H","H","KeyH",6.75,3.0,1.0,1.0],["J","J","KeyJ",7.75,3.0,1.0,1.0],["K","K","KeyK",8.75,3.0,1.0,1.0],["L","L","KeyL",9.75,3.0,1.0,1.0],["SEMICOLON",";","Semicolon",10.75,3.0,1.0,1.0],["QUOTE","'","Quote",11.75,3.0,1.0,1.0],["ENTER","enter","Enter",12.75,3.0,2.25,1.0],["KP_4","4","Numpad4",15.25,3.0,1.0,1.0],["KP_5","5","Numpad5",16.25,3.0,1.0,1.0],["KP_6","6","Numpad6",17.25,3.0,1.0,1.0],
      ["LSHIFT","shift","ShiftLeft",0.0,4.0,2.25,1.0],["Z","Z","KeyZ",2.25,4.0,1.0,1.0],["X","X","KeyX",3.25,4.0,1.0,1.0],["C","C","KeyC",4.25,4.0,1.0,1.0],["V","V","KeyV",5.25,4.0,1.0,1.0],["B","B","KeyB",6.25,4.0,1.0,1.0],["N","N","KeyN",7.25,4.0,1.0,1.0],["M","M","KeyM",8.25,4.0,1.0,1.0],["COMMA",",","Comma",9.25,4.0,1.0,1.0],["DOT",".","Period",10.25,4.0,1.0,1.0],["SLASH","/","Slash",11.25,4.0,1.0,1.0],["RSHIFT","shift","ShiftRight",12.25,4.0,1.75,1.0],["UP","↑","ArrowUp",14.15,4.0,1.0,1.0],["KP_1","1","Numpad1",15.25,4.0,1.0,1.0],["KP_2","2","Numpad2",16.25,4.0,1.0,1.0],["KP_3","3","Numpad3",17.25,4.0,1.0,1.0],["KP_ENTER","ent","NumpadEnter",18.25,4.0,1.0,2.0],
      ["LCTRL","ctrl","ControlLeft",0.0,5.0,1.25,1.0],["LGUI","super","MetaLeft",1.25,5.0,1.25,1.0],["LALT","alt","AltLeft",2.5,5.0,1.25,1.0],["SPACE","","Space",3.75,5.0,6.25,1.0],["RALT","alt","AltRight",10.0,5.0,1.0,1.0],["FN","fn","",11.0,5.0,1.0,1.0],["RCTRL","ctrl","ControlRight",12.0,5.0,1.0,1.0],["LEFT","←","ArrowLeft",13.1,5.0,1.0,1.0],["DOWN","↓","ArrowDown",14.15,5.0,1.0,1.0],["RIGHT","→","ArrowRight",15.2,5.0,1.0,1.0],["KP_0","0","Numpad0",16.25,5.0,1.0,1.0],["KP_DECIMAL",".","NumpadDecimal",17.25,5.0,1.0,1.0]
    ];

    const P = s => t => {
      t = Math.max(0, Math.min(1, t));
      for (let i = 1; i < s.length; i++) {
        if (t <= s[i][0]) {
          const [a, c0] = s[i-1], [b, c1] = s[i], f = (t - a) / (b - a || 1);
          return c0.map((v, j) => v + (c1[j] - v) * f);
        }
      }
      return s[s.length-1][1];
    };
    const hex = h => [1,3,5].map(i => parseInt(h.slice(i, i+2), 16) / 255);
    const pal = a => P(a.map(([t, h]) => [t, hex(h)]));
    const CHROMA = pal([[0,"#00F0FF"],[.28,"#6A00F4"],[.52,"#FF007F"],[.76,"#FF5400"],[1,"#00F0FF"]]);
    const cx = k => k[3] + k[5] / 2, cy = k => k[4] + k[6] / 2;

    const canvas = document.getElementById("kb");
    const g = canvas.getContext("2d");
    const dpr = 2;
    const w = 594;
    canvas.width = w * dpr;
    canvas.height = (w * 6 / 19.25) * dpr;
    canvas.style.height = (w * 6 / 19.25) + "px";

    function drawChroma(t) {
      const W = canvas.width, s = W / 19.25, r = s * 0.16;
      g.clearRect(0, 0, W, canvas.height);
      KEYS.forEach((k) => {
        const [cr, cg, cb] = CHROMA((((cx(k) + cy(k) * 1.3) / 12 - t * 0.2) % 1 + 1) % 1);
        const x = k[3] * s + s * 0.06;
        const y = k[4] * s + s * 0.06;
        const kw = k[5] * s - s * 0.12;
        const kh = k[6] * s - s * 0.12;
        const lum = Math.max(cr, cg, cb);
        const rgb = `rgb(${cr * 255 | 0},${cg * 255 | 0},${cb * 255 | 0})`;

        // Keycap glow
        g.shadowBlur = lum * s * 0.55;
        g.shadowColor = rgb;
        g.fillStyle = "#12121a";
        g.beginPath();
        g.roundRect(x, y, kw, kh, r);
        g.fill();

        // Keycap surface tint
        g.shadowBlur = 0;
        g.fillStyle = `rgba(${cr * 255 | 0},${cg * 255 | 0},${cb * 255 | 0},${0.25 + 0.75 * lum})`;
        g.fill();
        g.strokeStyle = "rgba(255, 255, 255, 0.12)";
        g.stroke();

        // Key legend
        if (k[1]) {
          g.fillStyle = (cr * 0.3 + cg * 0.59 + cb * 0.11 > 0.55) ? "rgba(0,0,0,0.85)" : "rgba(255,255,255,0.9)";
          g.font = `600 ${s * 0.22}px ui-monospace, monospace`;
          g.textAlign = "center";
          g.textBaseline = "middle";
          g.fillText(k[1], x + kw / 2, y + kh / 2);
        }
      });
    }

    drawChroma(1.85);
  </script>
</body>
</html>
